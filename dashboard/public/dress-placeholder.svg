<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="dressGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#475569" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Subtle Hanger -->
  <path d="M150 70 C150 60 162 60 162 50 C162 42 154 36 146 40 C140 44 142 52 144 55" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M110 88 L150 70 L190 88" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Bridal Gown Silhouette -->
  <g filter="url(#softGlow)">
    <!-- Skirt -->
    <path d="M136 150 C136 150 110 240 70 330 C65 342 74 354 88 354 C120 350 180 350 212 354 C226 354 235 342 230 330 C190 240 164 150 164 150 Z" fill="url(#dressGrad)" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Bodice / Corset -->
    <path d="M134 94 C134 94 126 112 132 145 C134 152 140 155 150 155 C160 155 166 152 168 145 C174 112 166 94 166 94 C160 98 155 100 150 100 C145 100 140 98 134 94 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Sweetheart Neckline Detail -->
    <path d="M134 94 C140 98 145 100 150 100 C155 100 160 98 166 94" stroke="#CBD5E1" stroke-width="1" fill="none"/>
    
    <!-- Waist Belt / Ribbon -->
    <path d="M133 148 C144 151 156 151 167 148" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Delicate Veil / Shimmer Overlay Lines -->
    <path d="M150 70 Q130 180 115 310" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6" stroke-dasharray="3 3"/>
    <path d="M150 70 Q170 180 185 310" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6" stroke-dasharray="3 3"/>
  </g>

  <!-- Sparkles -->
  <g fill="url(#accentGrad)" opacity="0.75">
    <path d="M225 110 Q230 110 230 105 Q230 110 235 110 Q230 110 230 115 Q230 110 225 110 Z"/>
    <path d="M75 180 Q80 180 80 175 Q80 180 85 180 Q80 180 80 185 Q80 180 75 180 Z" transform="scale(0.8) translate(15, 30)"/>
    <path d="M220 280 Q224 280 224 276 Q224 280 228 280 Q224 280 224 284 Q224 280 220 280 Z"/>
  </g>
</svg>
